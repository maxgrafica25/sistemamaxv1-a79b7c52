server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ---- Security headers (Etapa 4) ----
  # Aplicados em todas as respostas; CSP deliberadamente permissiva para Lovable
  # Cloud + Google Calendar OAuth. Ajustar se novos endpoints forem adicionados.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://*.lovable.app https://*.lovable.dev wss://*.supabase.co https://accounts.google.com https://www.googleapis.com; frame-src 'self' https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/wasm
    image/svg+xml;

  # Cache agressivo para assets com hash (Vite emite arquivos com fingerprint)
  location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico|wasm)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Nunca cachear o index.html (sempre buscar nova versão)
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # SPA fallback — qualquer rota desconhecida vai pro index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Bloqueia acesso a arquivos sensíveis (defesa em profundidade)
  location ~ /\.(?!well-known) {
    deny all;
  }
}
