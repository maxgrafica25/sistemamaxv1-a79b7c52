server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/wasm
    image/svg+xml;

  # Cache agressivo para assets com hash (Vite emite arquivos com fingerprint)
  location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico|wasm)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Nunca cachear o index.html (sempre buscar nova versão)
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # SPA fallback — qualquer rota desconhecida vai pro index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Bloqueia acesso a arquivos sensíveis (defesa em profundidade)
  location ~ /\.(?!well-known) {
    deny all;
  }
}
